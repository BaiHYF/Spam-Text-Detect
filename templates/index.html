<!DOCTYPE html>
<html>
<head>
    <title>垃圾信息检测</title>
    <style>
        .container { max-width: 800px; margin: auto; padding: 20px; }
        #input { width: 100%; height: 100px; margin: 10px 0; }
        .highlight { background: rgba(255,0,0,0.3); }      
        .button1 {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>垃圾信息检测器</h1>
        <textarea id="input" placeholder="输入文本..."></textarea>
        <button onclick="predict()" sytle="button1">检测</button>
        <div id="result"></div>
    </div>

    <script>
        function predict() {
            const text = document.getElementById('input').value;
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `text=${encodeURIComponent(text)}`
            })
            .then(res => res.json())
            .then(data => {
                let highlighted = '';
                text.split('').forEach((char, i) => {
                    const score = data.contributions[i].score;

                    const avg_score = data.avg

                    const color = score > avg_score
                        ? `rgba(255,0,0,0.35)` 
                        : `rgba(255,255,255,0)`;
                    highlighted += `<span style="background:${color}">${char}</span>`;
                });
                document.getElementById('result').innerHTML = `
                    <p>分类：${data.label}（置信度：${(data.probability*100).toFixed(1)}%）</p>
                    <div>${highlighted}</div>
                `;
            });
        }
    </script>
</body>
</html>
